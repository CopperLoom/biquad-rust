[package]
name = "biquad-rust"
version = "0.1.0"
edition = "2024"
description = "Rust implementation of parametric EQ optimization for audio devices"
license = "MIT"
repository = "https://github.com/CopperLoom/biquad-rust"
authors = ["CopperLoom <coppeloom@mailbox.org>"]
keywords = ["audio", "peq", "iem", "equalizer", "biquad"]
categories = ["multimedia::audio"]

[dependencies]
slsqp = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "optimize_benchmark"
harness = false

# slsqp is machine-translated C; debug symbols spike rustc memory to 15+ GB
[profile.dev.package.slsqp]
debug = false

[profile.release.package.slsqp]
debug = false
